<!DOCTYPE html>
<html>
<head>
  <title>My K8s Project</title>
</head>
<body>
  <h1>Hello from the frontend</h1>
  <p id="result">Loading...</p>

  <script>
    fetch('/api')
      .then(response => response.json())
      .then(data => {
        document.getElementById('result').innerText = data.message;
      })
      .catch(error => {
        document.getElementById('result').innerText = 'Could not reach backend';
      });
  </script>
</body>
</html>
